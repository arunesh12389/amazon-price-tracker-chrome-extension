<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Price Tracker</title>
    <link rel="stylesheet" href="/src/styles.css">


  </head>
  <body>
    <h3>Product Info</h3>
    <p><strong>Name:</strong> <span id="productName">-</span></p>
    <p><strong>Price:</strong> ₹<span id="productPrice">-</span></p>
    
    <!-- Add price threshold input -->
    <input 
      type="number" 
      id="priceThreshold" 
      placeholder="Notify me if price drops below (₹)"
      min="0"
      step="0.01"
    >
    
    <button id="trackBtn">Track This Product</button>
    
    <!-- Add dashboard link -->
    <div class="dashboard-link-container">
        <a href="dashboard.html" target="_blank" id="dashboardLink">
            📊 View Dashboard
        </a>
    </div>
    
    <!-- Status message container -->
    <div id="statusMessage"></div>


    <!-- Graph visualization container -->
    <div id="graphContainer" style="display:none;">
      <canvas id="graphCanvas"></canvas>
      <div class="recommendation">
        <strong>Recommendation:</strong> 
        <span id="recText"></span> 
        (<span id="confText"></span>% confidence)
      </div>
    </div>
    <!-- Use absolute paths with chrome-extension:// protocol -->
    <script src="/src/lib/chart.min.js" id="chartjs-script"></script>
    <script src="/src/popup.js"></script>
  </body>
</html>
