services:
  - type: web
    name: price-tracker-backend
    env: python
    runtime: python-3.11.0  
    buildCommand: pip install -r backend/requirements.txt && playwright install
    startCommand: uvicorn backend.main:app --host=0.0.0.0 --port=10000  
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0